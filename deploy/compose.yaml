name: asterflow

services:
  postgres:
    # Fixed multi-platform PG16 index (linux/amd64 and linux/arm64).
    image: pgvector/pgvector@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_USER: asterflow
      POSTGRES_DB: asterflow
      POSTGRES_PASSWORD: ${ASTERFLOW_POSTGRES_PASSWORD:?set ASTERFLOW_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ASTERFLOW_POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    # Pub/Sub only; persistence is intentionally disabled.
    image: redis@sha256:39353c6a2f310da333374e1290c91805d15a85def073b5090f58e4ac646d284c
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${ASTERFLOW_REDIS_PORT:-25433}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
