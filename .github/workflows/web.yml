name: Web
on:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 commit, verified from official ref
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test session and API behavior
        run: npm test
      - name: Typecheck and production build
        run: npm run build
