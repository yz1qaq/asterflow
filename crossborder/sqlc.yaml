version: "2"

sql:
  - engine: postgresql
    schema: migrations
    queries: internal/infrastructure/postgres/queries
    gen:
      go:
        package: pgstore
        out: internal/infrastructure/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"